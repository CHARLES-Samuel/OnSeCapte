<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Titre et Favicon -->
    <title>OnSeCapte — Organisez vos sorties entre amis</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />

    <!-- SEO & Description -->
    <link rel="canonical" href="https://onsecapte-25bae.firebaseapp.com" />
    <meta
      name="description"
      content="OnSeCapte est l'application simple et moderne pour organiser vos sorties, activités et événements entre amis. Proposez des dates, votez pour vos disponibilités et retrouvez-vous facilement !"

    <meta property="og:image" content="https://onsecapte-25bae.firebaseapp.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OnSeCapte — Organisez vos sorties entre amis" />

      name="twitter:description"
      content="Fini les boucles interminables de messages. Créez votre groupe, proposez des dates et captez-vous sans prise de tête !"

  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-primary-500 selection:text-white">
